# Suppress JVM target mismatch error — our project has no Java sources so this check is spurious.
# Remove once Kotlin adds JVM 25 target support.
kotlin.jvm.target.validation.mode=WARNING

# Kotlin daemon needs more heap for wasmJs production compilation (Compose Multiplatform is large).
kotlin.daemon.jvmargs=-Xmx4g

# Suppress warning about iOS/native targets being disabled on non-Mac hosts.
kotlin.native.ignoreDisabledTargets=true
